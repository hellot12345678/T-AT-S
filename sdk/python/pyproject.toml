[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t-at-s"
version = "1.0.0"
authors = [
  { name = "hellot12345678", email = "hellot12345678@gmail.com" },
]
description = "T@S (Talk. Decide. Solve.) — Universal AI Voice Agent Client SDK for Python & Django"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://github.com/hellot12345678/T-AT-S"
"Bug Tracker" = "https://github.com/hellot12345678/T-AT-S/issues"
